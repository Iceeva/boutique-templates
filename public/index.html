<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Templates web à copier ou télécharger</title>
<meta name="description" content="Galerie de templates web : aperçu en direct, code à copier, projet complet en ZIP. Sans compte.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="top"><a class="brand" id="brand" href="/">Templates</a></header>
<main class="wrap">
  <section class="hero">
    <h1>Des templates qui tournent déjà. Copie le code ou prends le ZIP.</h1>
    <form class="search" role="search" onsubmit="return false">
      <input id="q" type="search" placeholder="Un blog, une page de connexion, un dashboard…" autocomplete="off" aria-label="Rechercher un template">
      <select id="sort" aria-label="Trier">
        <option value="recent">Plus récents</option><option value="popular">Plus vus</option><option value="downloads">Plus téléchargés</option>
      </select>
    </form>
    <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
  </section>
  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>Aucun template ne correspond. Essaie un autre mot ou retire le filtre.</p>
  <div class="more"><button class="btn" id="more" hidden>Afficher plus</button></div>
</main>
<script type="module" src="/js/gallery.js"></script>
</body>
</html>
